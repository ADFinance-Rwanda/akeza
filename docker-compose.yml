services:
  db:
    image: postgres:17
    container_name: tenant-management-db
    environment:
      POSTGRES_DB: tenant_management
      POSTGRES_USER: ${DATABASE_USERNAME:-tenant}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-tenant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-tenant} -d tenant_management"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tenant-net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenant-management-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/tenant_management
      DATABASE_USERNAME: ${DATABASE_USERNAME:-tenant}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-tenant}
      JWT_SECRET: ${JWT_SECRET:-docker-local-jwt-secret-change-me-32chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - tenant-net
    restart: unless-stopped

networks:
  tenant-net:
    driver: bridge

volumes:
  postgres_data:
