spring.datasource.url=jdbc:h2:mem:redis_ttl_it;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.cache.type=none
KEYCLOAK_ISSUER=http://auth.test/realms/taskmgr
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth.test/realms/taskmgr
app.rate-limit.requests=50
app.rate-limit.window-seconds=60
app.analytics-cache-ttl-seconds=45
management.health.redis.enabled=true
management.health.db.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
