spring.datasource.url=jdbc:h2:mem:tenant_management_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.cache.cache-names=analytics
spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
KEYCLOAK_ISSUER=http://auth.test/realms/taskmgr
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth.test/realms/taskmgr
app.rate-limit.requests=5
app.rate-limit.window-seconds=60
app.idempotency.wait-ms=25
app.idempotency.wait-attempts=80
app.idempotency.cleanup-interval-ms=3600000
app.jobs.done-retention-hours=24
app.jobs.failed-retention-hours=168
app.jobs.cleanup-interval-ms=3600000
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db
