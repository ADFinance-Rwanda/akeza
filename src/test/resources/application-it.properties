spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.cache.type=none
KEYCLOAK_ISSUER=http://auth.test/realms/taskmgr
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth.test/realms/taskmgr
app.rate-limit.requests=20
app.rate-limit.window-seconds=60
app.analytics-cache-ttl-seconds=60
app.idempotency.wait-ms=20
app.idempotency.wait-attempts=50
management.health.redis.enabled=true
management.health.db.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
