spring.application.name=multi-tenant-management
spring.config.import=optional:file:./application-local.properties

# Create the database first: CREATE DATABASE tenant_management;
# Set DATABASE_URL / DATABASE_PASSWORD in the environment or gitignored application-local.properties.
# PostgreSQL 17 is used locally on port 5433 when 10 already occupies 5432.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tenant_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
