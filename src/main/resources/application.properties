spring.application.name=multi-tenant-management
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tenant_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.lettuce.shutdown-timeout=200ms

app.analytics-cache-ttl-seconds=${ANALYTICS_CACHE_TTL_SECONDS:60}
app.rate-limit.requests=${RATE_LIMIT_REQUESTS:30}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.idempotency.wait-ms=${IDEMPOTENCY_WAIT_MS:50}
app.idempotency.wait-attempts=${IDEMPOTENCY_WAIT_ATTEMPTS:40}
app.idempotency.stale-seconds=${IDEMPOTENCY_STALE_SECONDS:30}
app.idempotency.retention-hours=${IDEMPOTENCY_RETENTION_HOURS:24}
app.idempotency.cleanup-interval-ms=${IDEMPOTENCY_CLEANUP_INTERVAL_MS:3600000}

# Dashboard cache is written with StringRedisTemplate SET+EX (not Spring Cache TTL).
spring.cache.type=redis
spring.cache.cache-names=analytics

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.pattern.level=%5p [corr=%X{correlationId:-} user=%X{userSub:-} org=%X{orgId:-}]
